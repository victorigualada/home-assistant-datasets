task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "Here is a ready‑to‑use Home Assistant **blueprint** that will turn a fan\
  \ on when a humidity sensor exceeds a configured level and turn it off again when\
  \ the humidity falls back below that level. The blueprint also checks the current\
  \ state of the fan so it won’t send duplicate “turn‑on” or “turn‑off” commands.\n\
  \n```yaml\nblueprint:\n  name: Humidity‑based Fan Control\n  description: |\n  \
  \  Turn a fan on when a humidity sensor goes above a defined level and turn it off\n\
  \    when it falls below that level.  The fan is only commanded when its state actually\n\
  \    needs to change.\n  domain: automation\n  input:\n    humidity_sensor:\n  \
  \    name: Humidity sensor\n      description: The sensor that reports relative\
  \ humidity.\n      selector:\n        entity:\n          domain: sensor\n    humidity_level:\n\
  \      name: Humidity trigger level (%)\n      description: The humidity percentage\
  \ that will trigger the fan.\n      selector:\n        number:\n          min: 0\n\
  \          max: 100\n          unit_of_measurement: \"%\"\n    fan_entity:\n   \
  \   name: Fan to control\n      description: The fan that will be turned on/off.\n\
  \      selector:\n        entity:\n          domain: fan\n\ntrigger:\n  - platform:\
  \ numeric_state\n    entity_id: !input humidity_sensor\n    above: !input humidity_level\n\
  \  - platform: numeric_state\n    entity_id: !input humidity_sensor\n    below:\
  \ !input humidity_level\n\ncondition: []   # No extra conditions – you can add any\
  \ you need.\n\naction:\n  - choose:\n      # Trigger: humidity went above the threshold\
  \ → turn fan on (if off)\n      - conditions:\n          - condition: numeric_state\n\
  \            entity_id: !input humidity_sensor\n            above: !input humidity_level\n\
  \        sequence:\n          - condition: state\n            entity_id: !input\
  \ fan_entity\n            state: 'off'\n          - service: fan.turn_on\n     \
  \       target:\n              entity_id: !input fan_entity\n\n      # Trigger:\
  \ humidity went below the threshold → turn fan off (if on)\n      - conditions:\n\
  \          - condition: numeric_state\n            entity_id: !input humidity_sensor\n\
  \            below: !input humidity_level\n        sequence:\n          - condition:\
  \ state\n            entity_id: !input fan_entity\n            state: 'on'\n   \
  \       - service: fan.turn_off\n            target:\n              entity_id: !input\
  \ fan_entity\n    default: []   # No action if neither condition matches (should\
  \ not happen)\n```\n\n### How to use it\n\n1. In **Settings → Blueprints**, click\
  \ **+ Create Blueprint** and paste the YAML above.  \n2. Save the blueprint (give\
  \ it a name such as *Humidity‑based Fan Control*).  \n3. Go to **Settings → Automations\
  \ → Add Automation → Use Blueprint**.  \n4. Select the *Humidity‑based Fan Control*\
  \ blueprint.  \n5. Fill in the three inputs:\n   - **Humidity sensor** – e.g., `sensor.bathroom_exhaust_fan_humidity`\n\
  \   - **Humidity trigger level** – e.g., `60` (percent)\n   - **Fan entity** – e.g.,\
  \ `fan.bathroom_exhaust_fan`\n6. Save the automation.\n\nThe automation will now\
  \ keep the fan running only while the humidity stays above the defined level, and\
  \ it will stop the fan automatically once the humidity drops back down."
