task:
  input_text: |
    # Door left open

    ## Problem statement

    Create an blueprint automation to play an alert on the speaker when the door is
    left open.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Play an message on the living room speaker if the garage door has been left open for more than 30 minutes
    - When the front door is ajar for 5 minutes, play a sound on the kitchen bluetooth speaker.

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input           | Selector Type | Description                                                                           |
    | --------------- | ------------- | ------------------------------------------------------------------------------------- |
    | `door_sensor`   | `entity`      | A `binary_sensor` entity selector door sensor that is the target of the automation.   |
    | `alert_media`   | `media`       | The target for the `media` selector for the media player and media id with the alter. |
    | `open_duration` | `duration`    | A `duration` selector, the amount of time before playing the alert.                   |

    The automation should play the selected media when the door has been open for the specified duration.
response: |-
  Based on the live context, I can see that the Entry Door sensor is currently 'off' (closed). If you want to set up an automation to alert when a door is left open, you would need to:

  1. Monitor a binary_sensor entity (like the Entry Door)
  2. Set a duration timer
  3. Play an alert on a media player when the timer expires

  The automation would check if the door sensor remains 'on' for the specified duration, then trigger the media player to play an alert.

  For example, to set up an alert for when the Entry Door is left open:
  - Door sensor: Entry Door
  - Media player: Any speaker (like Living Room Smart Speaker)
  - Duration: 5 minutes (or whatever you prefer)

  Currently, the Entry Door is closed (state: 'off'). If it were to open, you could set up the automation to trigger after the specified time.

  Would you like me to help you with a specific scenario, such as checking a particular door or speaker?
