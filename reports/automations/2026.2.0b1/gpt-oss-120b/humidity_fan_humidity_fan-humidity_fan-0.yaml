task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "Here is a ready‑to‑use **Home Assistant Blueprint** that turns a fan on\
  \ when a humidity sensor exceeds a set value and turns it off when the humidity\
  \ falls back below that value.  \nIt also checks the current state of the fan so\
  \ it never tries to turn it on when it’s already on (or off when it’s already off).\n\
  \n```yaml\nblueprint:\n  name: Humidity‑controlled Fan\n  description: >-\n    Turn\
  \ a fan on when a humidity sensor goes above a threshold and turn it off\n    when\
  \ the humidity falls below the threshold. The fan is only commanded if\n    its\
  \ state actually needs to change.\n  domain: automation\n  input:\n    humidity_sensor:\n\
  \      name: Humidity sensor\n      description: The sensor that provides the humidity\
  \ percentage.\n      selector:\n        entity:\n          domain: sensor\n    \
  \      device_class: humidity\n    humidity_level:\n      name: Humidity level\n\
  \      description: Humidity percentage that triggers the fan.\n      selector:\n\
  \        number:\n          min: 0\n          max: 100\n          unit_of_measurement:\
  \ \"%\"\n    fan_entity:\n      name: Fan\n      description: The fan to be controlled.\n\
  \      selector:\n        entity:\n          domain: fan\n\ntrigger:\n  - platform:\
  \ numeric_state\n    entity_id: !input humidity_sensor\n    above: !input humidity_level\
  \        # Trigger when humidity rises above threshold\n  - platform: numeric_state\n\
  \    entity_id: !input humidity_sensor\n    below: !input humidity_level       \
  \ # Trigger when humidity falls back below threshold\n\ncondition: []   # No additional\
  \ conditions needed – the actions themselves guard against redundant commands\n\n\
  action:\n  - choose:\n      # ------------------------------\n      # 1️⃣  Humidity\
  \ went ABOVE threshold → turn fan ON (if it isn’t already)\n      # ------------------------------\n\
  \      - conditions:\n          - condition: numeric_state\n            entity_id:\
  \ !input humidity_sensor\n            above: !input humidity_level\n          -\
  \ condition: state\n            entity_id: !input fan_entity\n            state:\
  \ \"off\"\n        sequence:\n          - service: fan.turn_on\n            target:\n\
  \              entity_id: !input fan_entity\n\n      # ------------------------------\n\
  \      # 2️⃣  Humidity went BELOW threshold → turn fan OFF (if it isn’t already)\n\
  \      # ------------------------------\n      - conditions:\n          - condition:\
  \ numeric_state\n            entity_id: !input humidity_sensor\n            below:\
  \ !input humidity_level\n          - condition: state\n            entity_id: !input\
  \ fan_entity\n            state: \"on\"\n        sequence:\n          - service:\
  \ fan.turn_off\n            target:\n              entity_id: !input fan_entity\n\
  \n    # If none of the choose conditions match (e.g., the fan is already in the\n\
  \    # correct state), do nothing.\n    default: []\n\nmode: single\n```\n\n###\
  \ How to use it\n\n1. **Add the blueprint** – copy the YAML above into a new blueprint\
  \ file (e.g., `humidity_fan.yaml`) or paste it via **Settings → Blueprints → Import\
  \ Blueprint**.\n2. **Create an automation from the blueprint** – go to **Settings → Automations → Add\
  \ Automation → Use Blueprint**, select **“Humidity‑controlled Fan”**, and fill in:\n\
  \   - The humidity sensor (e.g., `sensor.bathroom_exhaust_fan_humidity`),\n   -\
  \ The humidity level you consider “too high” (e.g., `60`),\n   - The fan you want\
  \ to control (e.g., `fan.bathroom_exhaust_fan`).\n\nThe automation will now keep\
  \ the fan running only while the humidity stays above the set level, without sending\
  \ unnecessary on/off commands."
