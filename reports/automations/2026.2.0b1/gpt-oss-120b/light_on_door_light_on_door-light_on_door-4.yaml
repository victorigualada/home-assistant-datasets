task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here is a simple Home Assistant blueprint that turns one or more lights\
  \ on when a door (binary sensor) opens, and turns them off either when the door\
  \ closes or after a 2‑minute timeout.\n\n```yaml\nblueprint:\n  name: Light on Door\
  \ Open\n  description: Turn on a light (or lights) when a door opens, then turn\
  \ it off when the door closes or after a timeout.\n  domain: automation\n  source_url:\
  \ https://raw.githubusercontent.com/home-assistant/core/master/blueprints/automation/light_on_door.yaml\n\
  \  input:\n    door_sensor:\n      name: Door sensor\n      description: Binary\
  \ sensor that signals the door opening/closing\n      selector:\n        entity:\n\
  \          domain: binary_sensor\n    light_switch:\n      name: Light(s) to control\n\
  \      description: Light(s) that will be turned on/off\n      selector:\n     \
  \   target:\n          entity:\n            domain: light\n    timeout:\n      name:\
  \ Timeout (seconds)\n      description: Time after which the light is turned off\
  \ when the door remains open (0 = no timeout)\n      default: 120\n      selector:\n\
  \        number:\n          min: 0\n          max: 3600\n          unit_of_measurement:\
  \ seconds\n\nmode: restart\nmax_exceeded: silent\n\ntrigger:\n  - platform: state\n\
  \    entity_id: !input door_sensor\n    to: \"on\"   # door opened\n\naction:\n\
  \  - choose:\n      # If a timeout is set (greater than 0), wait then turn off\n\
  \      - conditions:\n          - condition: template\n            value_template:\
  \ \"{{ int(input.timeout) > 0 }}\"\n        sequence:\n          - service: light.turn_on\n\
  \            target: !input light_switch\n          - wait_for_trigger:\n      \
  \        - platform: state\n                entity_id: !input door_sensor\n    \
  \            to: \"off\"\n            timeout: \"{{ input.timeout }}\"\n       \
  \     continue_on_timeout: true\n          - service: light.turn_off\n         \
  \   target: !input light_switch\n\n    # If no timeout (0), just turn off when the\
  \ door closes\n    default:\n      - service: light.turn_on\n        target: !input\
  \ light_switch\n      - wait_for_trigger:\n          - platform: state\n       \
  \     entity_id: !input door_sensor\n            to: \"off\"\n      - service: light.turn_off\n\
  \        target: !input light_switch\n```\n\n### How it works\n1. **Trigger** –\
  \ Fires when the selected `door_sensor` changes to `on` (door opened).  \n2. **Action**\
  \ –  \n   * Turns the specified `light_switch` entity (or group of lights) on. \
  \ \n   * If a timeout (default 120 s) is set, it waits either for the door to close\
  \ **or** for the timeout to expire, then turns the lights off.  \n   * If the timeout\
  \ is set to `0`, the lights stay on until the door closes.  \n\nYou can use this\
  \ blueprint in the UI by creating a new automation, selecting **“Light on Door Open”**,\
  \ and configuring the door sensor, the lights you want to control, and the optional\
  \ timeout."
