task:
  input_text: |
    # Door left open

    ## Problem statement

    Create an blueprint automation to play an alert on the speaker when the door is
    left open.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Play an message on the living room speaker if the garage door has been left open for more than 30 minutes
    - When the front door is ajar for 5 minutes, play a sound on the kitchen bluetooth speaker.

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input           | Selector Type | Description                                                                           |
    | --------------- | ------------- | ------------------------------------------------------------------------------------- |
    | `door_sensor`   | `entity`      | A `binary_sensor` entity selector door sensor that is the target of the automation.   |
    | `alert_media`   | `media`       | The target for the `media` selector for the media player and media id with the alter. |
    | `open_duration` | `duration`    | A `duration` selector, the amount of time before playing the alert.                   |

    The automation should play the selected media when the door has been open for the specified duration.
response: "Here is a ready‑to‑use **Blueprint** you can add to your Home Assistant\
  \ `blueprints/automation` folder (e.g. `blueprints/automation/door_open_alert.yaml`).\
  \  \nIt takes the three inputs you described – the door binary sensor, the media\
  \ player + media to play, and the time the door must stay open before the alert\
  \ is triggered.\n\n```yaml\nblueprint:\n  name: Door left open – play alert\n  description:\
  \ >\n    Plays a selected sound or TTS message on a chosen media player when a\n\
  \    door (binary_sensor) has been open for a configurable amount of time.\n  domain:\
  \ automation\n  input:\n    door_sensor:\n      name: Door sensor\n      description:\
  \ Binary sensor that indicates the door is open/closed.\n      selector:\n     \
  \   entity:\n          domain: binary_sensor\n    alert_media:\n      name: Alert\
  \ media\n      description: Media player to play the alert on (and optional media\
  \ ID / URL).\n      selector:\n        media:\n    open_duration:\n      name: Open\
  \ duration\n      description: How long the door must stay open before playing the\
  \ alert.\n      selector:\n        duration:\n\nmode: restart   # restart timer\
  \ if the door closes/reopens before it finishes\n\ntrigger:\n  - platform: state\n\
  \    entity_id: !input door_sensor\n    from: \"off\"\n    to: \"on\"\n\ncondition:\
  \ []   # no extra conditions – you can add your own if needed\n\naction:\n  # Wait\
  \ for the door to stay open for the configured duration\n  - wait_for_trigger:\n\
  \      - platform: state\n        entity_id: !input door_sensor\n        to: \"\
  off\"\n    timeout: !input open_duration\n    continue_on_timeout: true\n\n  # If\
  \ the wait timed‑out (i.e. the door stayed open) then play the alert\n  - choose:\n\
  \      - conditions:\n          - condition: state\n            entity_id: !input\
  \ door_sensor\n            state: \"on\"\n        sequence:\n          - service:\
  \ media_player.play_media\n            data:\n              entity_id: \"{{ state_attr(\
  \ 'input_alert_media', 'entity_id') }}\"\n              media_content_id: \"{{ state_attr(\
  \ 'input_alert_media', 'media_content_id') }}\"\n              # If you used a TTS\
  \ service or a specific URL you can also use:\n              # media_content_type:\
  \ music  # or 'tune' / 'url' as appropriate\n            target:\n             \
  \ entity_id: !input alert_media\n  # If the door closed before the timeout, nothing\
  \ happens (the automation ends)\n\n# Optional: you can add a notification to let\
  \ you know the alert was played\n# - service: notify.mobile_app_your_phone\n#  \
  \ data:\n#     message: \"Alert played because {{ states('!input door_sensor') }}\
  \ was left open.\"\n```\n\n### How to use it\n1. **Save** the file (e.g. `door_open_alert.yaml`)\
  \ under `config/blueprints/automation/`.\n2. In the **Blueprints** UI go to **Create\
  \ Automation → Use Blueprint** and select **Door left open – play alert**.\n3. Fill\
  \ the three required inputs:  \n   * **Door sensor** – pick the binary sensor that\
  \ represents the front/garage/any door.  \n   * **Alert media** – choose the media\
  \ player (e.g., `media_player.living_room_smart_speaker`) and, if you want a specific\
  \ sound file, supply its URL or ID.  \n   * **Open duration** – set the time the\
  \ door must stay open (e.g., `00:05:00` for 5 minutes).\n\nWhen the selected door\
  \ becomes **on** (open) the automation starts a timer. If the door remains open\
  \ for the defined `open_duration`, the chosen media is played on the selected speaker.\
  \ If the door closes before the timer finishes, the wait is cancelled and no alert\
  \ is played.  \n\nFeel free to add extra conditions (e.g., only when you’re at home)\
  \ or additional actions (e.g., send a notification) as needed."
