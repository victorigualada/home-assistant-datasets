task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: "Here is a ready‑to‑use **Blueprint** you can add to your Home Assistant\
  \ `blueprints/automation` folder (e.g. `blueprints/automation/pause_vacuum_on_phone_call.yaml`).\
  \  \nIt creates an automation that pauses the selected vacuum whenever the specified\
  \ phone‑call binary sensor becomes **on**, but only if the vacuum is currently running.\n\
  \n```yaml\nblueprint:\n  name: Pause vacuum when a phone call is received\n  description:\
  \ >-\n    Pauses the selected vacuum when the chosen phone‑call binary sensor\n\
  \    changes to on, provided the vacuum is currently cleaning. The vacuum can be\n\
  \    resumed manually later.\n  domain: automation\n  input:\n    phone_call_sensor:\n\
  \      name: Phone call sensor\n      description: Binary sensor that turns on when\
  \ a phone call is received.\n      selector:\n        entity:\n          domain:\
  \ binary_sensor\n    vacuum_entity:\n      name: Vacuum\n      description: Vacuum\
  \ entity to pause.\n      selector:\n        entity:\n          domain: vacuum\n\
  \nmode: single\n\ntrigger:\n  - platform: state\n    entity_id: !input phone_call_sensor\n\
  \    to: \"on\"\n\ncondition:\n  # Only act if the vacuum is currently cleaning\
  \ / running\n  - condition: state\n    entity_id: !input vacuum_entity\n    state:\
  \ cleaning\n\naction:\n  - service: vacuum.pause\n    target:\n      entity_id:\
  \ !input vacuum_entity\n```\n\n### How to use it\n\n1. **Save** the file above as\
  \ `pause_vacuum_on_phone_call.yaml` under `<config>/blueprints/automation/`.\n2.\
  \ In Home Assistant go to **Settings → Automations & Scenes → Blue Prints** and\
  \ click **Import Blueprint** (or it will appear automatically after the file is\
  \ saved).\n3. Click **Create Automation** from the blueprint.\n4. Choose the **Phone\
  \ call sensor** (e.g. `binary_sensor.phone_call`) and the **Vacuum** (e.g. `vacuum.my_robot`).\n\
  5. Save the automation.\n\nWhen the phone‑call sensor goes to **on** and the vacuum\
  \ is cleaning, the automation will call `vacuum.pause` to pause it. You can resume\
  \ the vacuum manually (e.g., via the UI or a separate “resume vacuum” automation)."
