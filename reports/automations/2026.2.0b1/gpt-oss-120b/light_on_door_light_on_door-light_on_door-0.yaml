task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here is a ready‑to‑use Home Assistant Blueprint that does exactly what you described – it turns a light (or multiple lights) on when a door sensor opens, and turns the light(s) off either when the door closes **or** after a 2‑minute timeout.

  ```yaml
  blueprint:
    name: Light on door open
    description: >
      Turn on one or more lights when a door (binary_sensor) opens.
      The light(s) will be turned off when the door closes or after a
      configurable timeout (default 2 minutes).
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: The binary_sensor that detects the door opening/closing.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light(s) to control
        description: Light(s) to turn on when the door opens.
        selector:
          target:
            entity:
              domain: light
      timeout:
        name: Timeout (seconds)
        description: How long to keep the light on after the door opens (seconds).
        default: 120
        selector:
          number:
            min: 0
            max: 3600
            unit_of_measurement: seconds

  mode: restart
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"

  action:
    - choose:
        # If the door opens, turn the light(s) on and start the timer
        - conditions:
            - condition: template
              value_template: "{{ trigger.from_state.state == 'off' and trigger.to_state.state == 'on' }}"
          sequence:
            - service: light.turn_on
              target: !input light_switch
            - wait_for_trigger:
                - platform: state
                  entity_id: !input door_sensor
                  from: "on"
                  to: "off"
              timeout:
                seconds: !input timeout
            - service: light.turn_off
              target: !input light_switch
      default: []   # No other actions needed
  ```

  ### How to use the blueprint

  1. **Save** the YAML above as a file (e.g., `light_on_door.yaml`) in your Home Assistant `blueprints/automation/` folder.
  2. In the UI go to **Settings → Automations & Scenes → Blueprints → Import Blueprint** and select the file.
  3. Create a new automation from this blueprint:
     - Choose the door sensor (e.g., `binary_sensor.pantry_door`).
     - Choose the light(s) you want to control (e.g., `light.pantry_light`).
     - Optionally adjust the timeout (default is 120 seconds = 2 minutes).

  The automation will now keep the selected light(s) on while the door is open and automatically turn them off either when the door closes or when the timeout expires.
