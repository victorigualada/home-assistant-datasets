task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "Here is a ready‑to‑use Home Assistant blueprint that turns a fan on when\
  \ a humidity sensor exceeds a chosen value and turns it off when the humidity falls\
  \ back below that value.\n\n```yaml\nblueprint:\n  name: Humidity‑Based Fan Control\n\
  \  description: |\n    Turns a fan on when the selected humidity sensor goes above\
  \ the\n    configured threshold and turns it off when the humidity drops back\n\
  \    below that threshold. The fan is only toggled when its state actually\n   \
  \ needs to change.\n  domain: automation\n  input:\n    humidity_sensor:\n     \
  \ name: Humidity sensor\n      description: Sensor that provides the humidity percentage.\n\
  \      selector:\n        entity:\n          domain: sensor\n    humidity_level:\n\
  \      name: Humidity threshold\n      description: Humidity percentage that triggers\
  \ the fan.\n      selector:\n        number:\n          min: 0\n          max: 100\n\
  \          unit_of_measurement: \"%\"\n    fan_entity:\n      name: Fan to control\n\
  \      description: Fan that will be turned on/off.\n      selector:\n        entity:\n\
  \          domain: fan\n\ntrigger:\n  # Trigger when humidity rises above the threshold\n\
  \  - platform: numeric_state\n    entity_id: !input humidity_sensor\n    above:\
  \ !input humidity_level\n\n  # Trigger when humidity falls back below the threshold\n\
  \  - platform: numeric_state\n    entity_id: !input humidity_sensor\n    below:\
  \ !input humidity_level\n\naction:\n  - choose:\n      # If humidity is now above\
  \ the threshold, turn the fan on (if it isn’t already)\n      - conditions:\n  \
  \        - condition: numeric_state\n            entity_id: !input humidity_sensor\n\
  \            above: !input humidity_level\n          - condition: state\n      \
  \      entity_id: !input fan_entity\n            state: \"off\"\n        sequence:\n\
  \          - service: fan.turn_on\n            target:\n              entity_id:\
  \ !input fan_entity\n\n      # If humidity is now below the threshold, turn the\
  \ fan off (if it isn’t already)\n      - conditions:\n          - condition: numeric_state\n\
  \            entity_id: !input humidity_sensor\n            below: !input humidity_level\n\
  \          - condition: state\n            entity_id: !input fan_entity\n      \
  \      state: \"on\"\n        sequence:\n          - service: fan.turn_off\n   \
  \         target:\n              entity_id: !input fan_entity\n\nmode: restart\n\
  ```\n\n**How to use**\n\n1. Add the blueprint (Configuration → Blueprints → Import\
  \ Blueprint) and paste the YAML above.  \n2. Create a new automation from this blueprint.\
  \  \n3. Select your bathroom humidity sensor (e.g., `sensor.bathroom_exhaust_fan_humidity`),\
  \ set the desired humidity level (e.g., 60 %), and choose the fan entity (e.g.,\
  \ `fan.bathroom_exhaust_fan`).  \n\nThe automation will now automatically keep the\
  \ fan running only while the humidity stays above the configured level."
