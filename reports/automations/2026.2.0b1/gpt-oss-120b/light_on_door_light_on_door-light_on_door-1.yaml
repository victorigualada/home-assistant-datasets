task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here is a ready‑to‑use Home Assistant blueprint that turns a light (or lights) on when a door sensor opens and turns the light(s) off when the door closes or after a 2‑minute timeout.

  ```yaml
  blueprint:
    name: Light on door open
    description: >-
      Turns on one or more lights when a door (binary_sensor) opens and turns them
      off when the door closes or after a 2‑minute timeout.
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: Binary sensor that represents the door (e.g., pantry door)
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light(s) to control
        description: Light(s) that will be turned on when the door opens
        selector:
          target:
            entity:
              domain: light
      timeout_minutes:
        name: Timeout (minutes)
        description: How long to keep the light on after the door is closed
        default: 2
        selector:
          number:
            min: 0
            max: 60
            unit_of_measurement: minutes

  mode: restart
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: 'off'
      to: 'on'          # door opened

  action:
    - choose:
        # When the door opens – turn the light(s) on
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - service: light.turn_on
              target: !input light_switch
            # Schedule a timer to turn the lights off after the timeout
            - wait_template: "{{ is_state('!input door_sensor', 'off') }}"
              timeout: "{{ (input.timeout_minutes | int) * 60 }}"
              continue_on_timeout: true
            - service: light.turn_off
              target: !input light_switch

    # If the door closes before the timeout, turn the light(s) off immediately
    - choose:
        - conditions:
            - condition: state
              entity_id: !input door_sensor
              state: 'off'
          sequence:
            - service: light.turn_off
              target: !input light_switch
  ```

  ### How to use the blueprint

  1. Save the YAML above as a file (e.g., `light_on_door.yaml`) in your **`config/blueprints/automation/`** folder.
  2. In Home Assistant go to **Settings → Automations & Scenes → Blueprints** and click **Import blueprint**. Choose the file you just saved.
  3. Create a new automation from the imported blueprint:
     * Select the door binary sensor (e.g., `binary_sensor.pantry_door`).
     * Select the light(s) you want to control (e.g., `light.pantry_light`).
     * Optionally adjust the timeout (default is 2 minutes).

  The automation will now turn the selected light(s) on when the door opens, turn them off when the door closes, and also ensure they are turned off after the configured timeout if the door stays open.
