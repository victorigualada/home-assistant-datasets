task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here is a minimal Home Assistant blueprint that turns a light (or lights) on when a door sensor opens, turns it off when the door closes, and also turns it off after a 2‑minute timeout.

  ```yaml
  blueprint:
    name: Light on door
    description: Turn on a light when a door opens and turn it off when the door closes or after a timeout.
    domain: automation
    source_url: https://github.com/your-repo/blueprints  # optional
    input:
      door_sensor:
        name: Door sensor
        description: Binary sensor that triggers the automation.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light(s)
        description: Light(s) to turn on/off.
        selector:
          target:
            entity:
              domain: light
      timeout:
        name: Timeout (seconds)
        description: How long to keep the light on after the door opens.
        default: 120
        selector:
          number:
            min: 1
            max: 3600
            unit_of_measurement: seconds

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: "on"          # door opened
    - platform: state
      entity_id: !input door_sensor
      to: "off"         # door closed

  condition: []

  action:
    - choose:
        # When the door opens – turn the light on and start a timer
        - conditions:
            - condition: trigger
              platform: state
              entity_id: !input door_sensor
              to: "on"
          sequence:
            - service: light.turn_on
              target: !input light_switch
            - wait_for_trigger:
                - platform: state
                  entity_id: !input door_sensor
                  to: "off"
              timeout: !input timeout
              continue_on_timeout: true
            - service: light.turn_off
              target: !input light_switch

        # When the door closes (if it closes before the timeout) – just turn the light off
        - conditions:
            - condition: trigger
              platform: state
              entity_id: !input door_sensor
              to: "off"
          sequence:
            - service: light.turn_off
              target: !input light_switch
  ```

  ### How it works
  1. **Triggers** – The automation fires when the selected `door_sensor` changes to `on` (door opened) **or** to `off` (door closed).
  2. **When opened** – It turns the selected `light_switch` on, then waits either for the door to close **or** the timeout (default 2 minutes). Whichever happens first, it turns the light off.
  3. **When closed** – If the door closes before the timeout, the second branch immediately turns the light off.

  You can use this blueprint in the UI by providing:
  - the binary‑sensor entity for your pantry door,
  - the light entity (or group) you want to control,
  - optionally a different timeout value.
