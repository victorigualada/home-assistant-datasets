task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here is a ready‑to‑use YAML blueprint that turns a light (or lights) on\
  \ when a door sensor opens and turns it off again when the door closes **or** after\
  \ a 2‑minute timeout.\n\n```yaml\n# blueprint.yaml\nblueprint:\n  name: Light on\
  \ door open\n  description: |\n    Turn on one or more lights when a door (binary_sensor)\
  \ opens.\n    Lights are turned off when the door closes or after a 2‑minute timeout.\n\
  \  domain: automation\n  input:\n    door_sensor:\n      name: Door sensor\n   \
  \   description: Binary sensor that reports the door state.\n      selector:\n \
  \       entity:\n          domain: binary_sensor\n    light_switch:\n      name:\
  \ Light(s) to control\n      description: Light(s) to turn on when the door opens.\n\
  \      selector:\n        target:\n          entity:\n            domain: light\n\
  \nmode: restart  # restart the timeout if the door re‑opens while already open\n\
  \ntrigger:\n  - platform: state\n    entity_id: !input door_sensor\n    from: \"\
  off\"\n    to: \"on\"      # door opens\n\naction:\n  # 1️⃣ Turn the light(s) on\
  \ immediately\n  - service: light.turn_on\n    target: !input light_switch\n\n \
  \ # 2️⃣ Wait for either the door to close or the timeout to expire\n  - wait_for_trigger:\n\
  \      - platform: state\n        entity_id: !input door_sensor\n        from: \"\
  on\"\n        to: \"off\"      # door closes\n    timeout:\n      minutes: 2\n \
  \   continue_on_timeout: true   # continue even if timeout occurs\n\n  # 3️⃣ Turn\
  \ the light(s) off (when the wait ends – either because of door close or timeout)\n\
  \  - service: light.turn_off\n    target: !input light_switch\n```\n\n### How to\
  \ use it\n\n1. In Home Assistant go to **Settings → Automations & Scenes → Blueprints**\
  \ and click **+ Create Blueprint**.  \n2. Paste the YAML above and save it (e.g.,\
  \ name it *Light on door open*).  \n3. Create a new automation from this blueprint:\
  \  \n   * Choose the **door sensor** (e.g., `binary_sensor.pantry_door`).  \n  \
  \ * Choose the **light(s)** to control (e.g., `light.pantry_light`).  \n\nThe automation\
  \ will now:\n- Turn the selected light(s) on when the door opens.  \n- Turn them\
  \ off when the door closes **or** after 2 minutes, whichever happens first.  \n\n\
  Feel free to adjust the `timeout` value (minutes/seconds) if you need a different\
  \ delay."
