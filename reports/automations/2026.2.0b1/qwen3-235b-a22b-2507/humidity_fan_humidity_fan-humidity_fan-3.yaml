task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "The user is asking for help creating a **blueprint automation** for Home\
  \ Assistant, not for a real-time action or query. This is a configuration and development\
  \ task.\n\nSince this request does not involve:\n- Checking live state (e.g., current\
  \ humidity, fan state),\n- Controlling devices,\n- Getting the time, or\n- Playing\
  \ media,\n\nand is instead about **defining a reusable automation blueprint**, no\
  \ tool calls are needed.\n\nHere is a Home Assistant automation blueprint that matches\
  \ your specification:\n\n```yaml\nblueprint:\n  name: Humidity Fan Control\n  description:\
  \ Turn on a fan when humidity exceeds a threshold.\n  domain: automation\n  input:\n\
  \    humidity_sensor:\n      name: Humidity Sensor\n      description: The sensor\
  \ that measures humidity.\n      selector:\n        entity:\n          domain: sensor\n\
  \    humidity_level:\n      name: Humidity Level\n      description: The humidity\
  \ percentage threshold to trigger the fan.\n      default: 60\n      selector:\n\
  \        number:\n          min: 0\n          max: 100\n          unit_of_measurement:\
  \ \"%\"\n    fan_entity:\n      name: Fan Entity\n      description: The fan to\
  \ turn on when humidity is too high.\n      selector:\n        entity:\n       \
  \   domain: fan\n\ntrigger:\n  - platform: numeric_state\n    entity_id: !input\
  \ humidity_sensor\n    above: !input humidity_level\n\ncondition: []\naction:\n\
  \  - condition: state\n    entity_id: !input fan_entity\n    match: \"all\"\n  \
  \  state: \"off\"\n  - service: fan.turn_on\n    target:\n      entity_id: !input\
  \ fan_entity\n\n---\ntrigger:\n  - platform: numeric_state\n    entity_id: !input\
  \ humidity_sensor\n    below: !input humidity_level\n\ncondition: []\naction:\n\
  \  - condition: state\n    entity_id: !input fan_entity\n    match: \"all\"\n  \
  \  state: \"on\"\n  - service: fan.turn_off\n    target:\n      entity_id: !input\
  \ fan_entity\n```\n\n### How to Use This Blueprint\n\n1. Go to **Settings > Automations\
  \ & Scenes > Blueprints** in Home Assistant.\n2. Click **Import Blueprint** and\
  \ paste the above YAML.\n3. Create a new automation using this blueprint.\n4. Select:\n\
  \   - The bathroom humidity sensor (`Bathroom Exhaust Fan Humidity`),\n   - Set\
  \ the threshold (e.g., 60%),\n   - Choose the fan (`Bathroom Exhaust Fan`).\n\n\
  This will:\n- Turn the fan **on** when humidity **goes above** the set level (and\
  \ only if it's off).\n- Turn the fan **off** when humidity **drops below** the level\
  \ (and only if it's on). \n\nNo further action needed — the automation handles state\
  \ checks efficiently."
