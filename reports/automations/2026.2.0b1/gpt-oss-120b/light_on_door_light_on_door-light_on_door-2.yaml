task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here is a ready‑to‑use Home Assistant Blueprint that turns a light (or\
  \ group of lights) on when a door sensor opens, and turns the light off either when\
  \ the door closes **or** after a 2‑minute timeout.\n\n```yaml\nblueprint:\n  name:\
  \ Light on door open\n  description: Turn on a light when a door opens and turn\
  \ it off when it closes or after a timeout.\n  domain: automation\n  source_url:\
  \ https://example.com/blueprints/light_on_door.yaml   # (optional)\n\n  input:\n\
  \    door_sensor:\n      name: Door sensor\n      description: Binary sensor that\
  \ reports the door state\n      selector:\n        entity:\n          domain: binary_sensor\n\
  \    light_switch:\n      name: Light(s) to control\n      description: Light(s)\
  \ that should be turned on/off\n      selector:\n        target:\n          entity:\n\
  \            domain: light\n    timeout:\n      name: Timeout (seconds)\n      description:\
  \ How long to keep the light on after the door opens (0 = no timeout)\n      default:\
  \ 120\n      selector:\n        number:\n          min: 0\n          max: 3600\n\
  \          unit_of_measurement: seconds\n\nmode: restart\nmax_exceeded: silent\n\
  \ntrigger:\n  - platform: state\n    entity_id: !input door_sensor\n    from: \"\
  off\"\n    to: \"on\"      # door opened\n\naction:\n  # Turn the light(s) on immediately\n\
  \  - service: light.turn_on\n    target: !input light_switch\n\n  # If a timeout\
  \ is set, wait and then turn the light(s) off\n  - choose:\n      - conditions:\n\
  \          - condition: numeric_state\n            entity_id: !input timeout\n \
  \           above: 0\n        sequence:\n          - delay: \"{{ states('input_number.timeout')\
  \ | int }}\"\n\n          # Turn off the light(s) after the timeout *unless* the\
  \ door has already closed\n          - condition: state\n            entity_id:\
  \ !input door_sensor\n            state: \"on\"\n          - service: light.turn_off\n\
  \            target: !input light_switch\n    default: []\n\n# Also turn the light(s)\
  \ off immediately when the door closes\n  - choose:\n      - conditions:\n     \
  \     - condition: state\n            entity_id: !input door_sensor\n          \
  \  state: \"off\"\n        sequence:\n          - service: light.turn_off\n    \
  \        target: !input light_switch\n    default: []\n```\n\n### How to use the\
  \ blueprint\n1. Save the YAML above as a file (e.g., `light_on_door.yaml`) in your\
  \ `config/blueprints/automation/` folder or copy‑paste it directly via **Configuration\
  \ → Blueprints** in the Home Assistant UI.\n2. Create a new automation from **Configuration\
  \ → Automations → Add Automation → Use Blueprint** and select **Light on door open**.\n\
  3. Choose the appropriate **door sensor** (e.g., `binary_sensor.pantry_door`) and\
  \ **light(s)** (e.g., `light.pantry_light`).  \n   Optionally adjust the timeout\
  \ (default is 120 seconds = 2 minutes).\n\nThe automation will now:\n- Turn the\
  \ selected light(s) on as soon as the door opens.\n- Turn the light(s) off when\
  \ the door closes **or** after the configured timeout, whichever happens first."
