task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: |-
  The blueprint you're describing cannot be created directly through this interface, as it requires configuration within Home Assistant's YAML or UI automation editor. However, here's how you can implement it manually in Home Assistant:

  ### Blueprint Configuration

  ```yaml
  blueprint:
    name: "Humidity Fan Control"
    description: "Turns on a fan when humidity exceeds a threshold."
    domain: automation
    input:
      humidity_sensor:
        name: Humidity Sensor
        selector:
          entity:
            domain: sensor
            device_class: humidity
      humidity_level:
        name: Humidity Level
        description: "Turn on fan when humidity is above this value."
        default: 60
        selector:
          number:
            min: 0
            max: 100
            step: 1
            unit: "%"
      fan_entity:
        name: Fan Entity
        selector:
          entity:
            domain: fan

  trigger:
    - platform: numeric_state
      entity_id: !input humidity_sensor
      above: !input humidity_level

  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: !input fan_entity
              state: "off"
          sequence:
            - service: fan.turn_on
              target:
                entity_id: !input fan_entity
      default: []
    - wait_for_trigger:
        - platform: numeric_state
          entity_id: !input humidity_sensor
          below: !input humidity_level
    - choose:
        - conditions:
            - condition: state
              entity_id: !input fan_entity
              state: "on"
          sequence:
            - service: fan.turn_off
              target:
                entity_id: !input fan_entity
      default: []
  ```

  ### How to Use:

  1. Go to **Settings > Automations & Scenes > Blueprints > Helpers > Create Automation from Blueprint**.
  2. Paste the YAML above into a new file in your `blueprints/automation` folder.
  3. Use the blueprint when creating a new automation:
     - Select the blueprint.
     - Choose the `Bathroom Exhaust Fan Humidity` sensor.
     - Set the threshold (e.g., 60%).
     - Select the `Bathroom Exhaust Fan`.

  This automation ensures the fan only turns on when needed and avoids redundant commands.
