task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here’s a ready‑to‑use Home Assistant blueprint that turns a light (or a\
  \ group of lights) on when a door sensor opens, and then turns the light(s) off\
  \ either when the door closes **or** after a 2‑minute timeout.\n\n```yaml\nblueprint:\n\
  \  name: Turn on light when door opens\n  description: >\n    Turn on one or more\
  \ lights when a door (binary_sensor) opens,\n    then turn them off when the door\
  \ closes or after a 2‑minute delay.\n  domain: automation\n  input:\n    door_sensor:\n\
  \      name: Door sensor\n      description: Binary sensor that detects the door\
  \ (e.g. pantry door)\n      selector:\n        entity:\n          domain: binary_sensor\n\
  \    light_switch:\n      name: Light(s)\n      description: Light(s) to turn on\
  \ when the door opens\n      selector:\n        target:\n          entity:\n   \
  \         domain: light\n    timeout:\n      name: Timeout (seconds)\n      description:\
  \ Time after which the light is turned off if the door stays open\n      default:\
  \ 120\n      selector:\n        number:\n          min: 0\n          max: 3600\n\
  \          unit_of_measurement: seconds\n\nmode: restart  # Restart timer if the\
  \ door re‑opens while the timer is running\n\ntrigger:\n  - platform: state\n  \
  \  entity_id: !input door_sensor\n    from: \"off\"\n    to: \"on\"\n\naction:\n\
  \  # Turn the light(s) on immediately\n  - service: light.turn_on\n    target: !input\
  \ light_switch\n\n  # Wait for the timeout, then turn the light(s) off (if still\
  \ open)\n  - wait_for_trigger:\n      - platform: state\n        entity_id: !input\
  \ door_sensor\n        from: \"on\"\n        to: \"off\"\n    timeout: !input timeout\n\
  \    continue_on_timeout: true\n\n  # If we get here because the door closed, or\
  \ because the timeout expired,\n  # turn the light(s) off.\n  - service: light.turn_off\n\
  \    target: !input light_switch\n```\n\n### How to use\n\n1. **Add the blueprint**\
  \  \n   - Go to **Settings → Automations & Scenes → Blueprints → Create Blueprint**\
  \ and paste the YAML above.\n\n2. **Create an automation from the blueprint**  \n\
  \   - Click **Create Automation**, choose the “Turn on light when door opens” blueprint.\
  \  \n   - Select your door’s binary sensor (e.g., `binary_sensor.pantry_door`).\
  \  \n   - Select the light(s) you want to control (e.g., `light.pantry_light`).\
  \  \n   - Adjust the timeout if you want a different delay (default = 120 seconds).\n\
  \nThat’s it—when the door opens the light turns on, and it will automatically turn\
  \ off when the door closes *or* after the specified timeout."
