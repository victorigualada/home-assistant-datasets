task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "Here is a complete Home Assistant Blueprint that meets the requirements.\
  \  \nSave it (for example as `humidity_fan.yaml`) in the `blueprints/automation`\
  \ folder of your config and then you can create automations from it in the UI.\n\
  \n```yaml\nblueprint:\n  name: Humidity‑controlled fan\n  description: >-\n    Turns\
  \ a fan on when a humidity sensor rises above a chosen level and\n    turns it off\
  \ when the humidity drops below that level. The automation\n    checks the current\
  \ state of the fan so it never tries to turn it on\n    when it is already on, or\
  \ turn it off when it is already off.\n  domain: automation\n  input:\n    humidity_sensor:\n\
  \      name: Humidity sensor\n      description: Sensor that provides the current\
  \ relative humidity (%)\n      selector:\n        entity:\n          domain: sensor\n\
  \          device_class: humidity\n    humidity_level:\n      name: Humidity trigger\
  \ level\n      description: Humidity percentage that will trigger the fan\n    \
  \  selector:\n        number:\n          min: 0\n          max: 100\n          unit_of_measurement:\
  \ \"%\"\n    fan_entity:\n      name: Fan to control\n      description: The fan\
  \ that should be turned on/off\n      selector:\n        entity:\n          domain:\
  \ fan\n\ntrigger:\n  - platform: numeric_state\n    entity_id: !input humidity_sensor\n\
  \    above: !input humidity_level\n  - platform: numeric_state\n    entity_id: !input\
  \ humidity_sensor\n    below: !input humidity_level\n\ncondition: []   # No extra\
  \ conditions – everything is handled in actions\n\naction:\n  - choose:\n      #\
  \ -------------------------------------------------\n      # 1️⃣ When humidity rises\
  \ above the threshold → turn fan ON\n      # -------------------------------------------------\n\
  \      - conditions:\n          - condition: numeric_state\n            entity_id:\
  \ !input humidity_sensor\n            above: !input humidity_level\n        sequence:\n\
  \          - choose:\n              - conditions:\n                  - condition:\
  \ state\n                    entity_id: !input fan_entity\n                    state:\
  \ \"off\"\n                sequence:\n                  - service: fan.turn_on\n\
  \                    target:\n                      entity_id: !input fan_entity\n\
  \          # (if fan already on, do nothing)\n\n      # -------------------------------------------------\n\
  \      # 2️⃣ When humidity falls below the threshold → turn fan OFF\n      # -------------------------------------------------\n\
  \      - conditions:\n          - condition: numeric_state\n            entity_id:\
  \ !input humidity_sensor\n            below: !input humidity_level\n        sequence:\n\
  \          - choose:\n              - conditions:\n                  - condition:\
  \ state\n                    entity_id: !input fan_entity\n                    state:\
  \ \"on\"\n                sequence:\n                  - service: fan.turn_off\n\
  \                    target:\n                      entity_id: !input fan_entity\n\
  \          # (if fan already off, do nothing)\nmode: single\n```\n\n### How it works\n\
  1. **Triggers** – The automation fires both when the humidity goes **above** the\
  \ chosen level and when it goes **below** it.\n2. **Actions** –  \n   * If the trigger\
  \ is “above”, the blueprint checks that the fan is currently **off** before issuing\
  \ `fan.turn_on`.  \n   * If the trigger is “below”, it checks that the fan is **on**\
  \ before issuing `fan.turn_off`.  \n   This prevents unnecessary calls when the\
  \ fan is already in the desired state.\n3. **Inputs** – The three inputs let you\
  \ pick any humidity sensor, set the threshold, and select the fan you want to control.\n\
  \nYou can now use this blueprint to create automations such as “Turn on the bathroom\
  \ exhaust fan when humidity is > 60 %” or “Turn off the garage ventilation fan when\
  \ humidity drops below 55 %”."
