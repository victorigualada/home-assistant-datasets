task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: "Here is a minimal Home Assistant blueprint that pauses a vacuum when a\
  \ phone‑call binary sensor becomes **on**, but only if the vacuum is currently running.\n\
  \n```yaml\nblueprint:\n  name: Pause Vacuum on Phone Call\n  description: >\n  \
  \  Pause a vacuum when a phone call is received.\n    The automation triggers when\
  \ the specified phone‑call binary sensor turns on\n    and the vacuum is currently\
  \ cleaning.\n  domain: automation\n  input:\n    phone_call_sensor:\n      name:\
  \ Phone Call Sensor\n      description: Binary sensor that becomes on when a phone\
  \ call is received\n      selector:\n        entity:\n          domain: binary_sensor\n\
  \    vacuum_entity:\n      name: Vacuum\n      description: Vacuum to pause\n  \
  \    selector:\n        entity:\n          domain: vacuum\n\ntrigger:\n  - platform:\
  \ state\n    entity_id: !input phone_call_sensor\n    to: \"on\"\n\ncondition:\n\
  \  - condition: state\n    entity_id: !input vacuum_entity\n    state: cleaning\
  \   # vacuum is running\n\naction:\n  - service: vacuum.pause\n    target:\n   \
  \   entity_id: !input vacuum_entity\n```\n\n**How it works**\n\n1. **Trigger** –\
  \ Fires when the `phone_call_sensor` changes to `on` (i.e., a call is detected).\
  \  \n2. **Condition** – Checks that the selected vacuum’s state is `cleaning` (the\
  \ vacuum is currently running).  \n3. **Action** – Calls the `vacuum.pause` service\
  \ for the chosen vacuum, pausing it without stopping or sending it back to the dock.\
  \  \n\nYou can import this blueprint in Home Assistant, then create an automation\
  \ from it by selecting the appropriate phone‑call sensor and vacuum entity. The\
  \ vacuum can be resumed manually whenever you like."
