task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: |-
  Here is a minimal **Blueprint** you can add to `/config/blueprints/automation` (or copy & paste it in the UI → Blueprints → Create Blueprint). It pauses the specified vacuum whenever the chosen binary‑sensor becomes *on* (i.e., a phone call is detected) and only if the vacuum is currently running.

  ```yaml
  blueprint:
    name: Pause vacuum on phone call
    description: >-
      Pause a vacuum when a phone call is received (binary_sensor turns on).
      The vacuum is paused only if it is currently cleaning.
    domain: automation
    input:
      phone_call_sensor:
        name: Phone call binary sensor
        description: Binary sensor that is on while a phone call is active
        selector:
          entity:
            domain: binary_sensor
      vacuum_entity:
        name: Vacuum
        description: Vacuum that should be paused
        selector:
          entity:
            domain: vacuum

  trigger:
    - platform: state
      entity_id: !input phone_call_sensor
      to: "on"

  condition:
    - condition: state
      entity_id: !input vacuum_entity
      state: cleaning   # most vacuums report “cleaning” when running

  action:
    - service: vacuum.pause
      target:
        entity_id: !input vacuum_entity
  ```

  ### How to use

  1. **Save** the YAML as e.g. `pause_vacuum_on_phone_call.yaml` in the *blueprints/automation* folder (or paste it via the UI).
  2. Go to **Configuration → Automations & Scenes → Automations**, click **Add Automation**, choose **“Create from Blueprint”**, and select **“Pause vacuum on phone call”**.
  3. Pick the appropriate **phone call sensor** and **vacuum entity**.
  4. Save the automation.

  Now whenever the phone‑call sensor turns on, the automation checks that the vacuum is currently cleaning and sends `vacuum.pause` to stop it temporarily. The vacuum can be resumed manually or via another automation.
