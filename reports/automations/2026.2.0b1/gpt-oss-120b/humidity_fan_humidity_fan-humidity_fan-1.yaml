task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: "Here is a ready‑to‑use **Home Assistant Blueprint** that turns a fan on\
  \ when a humidity sensor exceeds a chosen threshold and turns it off again when\
  \ the humidity drops below that threshold.  \nThe blueprint takes three inputs –\
  \ the humidity sensor, the desired humidity level, and the fan entity – and includes\
  \ the necessary logic to avoid redundant on/off calls.\n\n```yaml\nblueprint:\n\
  \  name: Humidity‑controlled fan\n  description: >\n    Turn a fan on when a humidity\
  \ sensor exceeds a defined level and turn it\n    off again when the humidity falls\
  \ below that level. The automation will\n    only send commands when the fan’s current\
  \ state differs from the desired\n    state.\n  domain: automation\n  input:\n \
  \   humidity_sensor:\n      name: Humidity sensor\n      description: Sensor that\
  \ provides the current humidity (%)\n      selector:\n        entity:\n        \
  \  domain: sensor\n    humidity_level:\n      name: Humidity trigger level\n   \
  \   description: Humidity percentage that will trigger the fan\n      selector:\n\
  \        number:\n          min: 0\n          max: 100\n          unit_of_measurement:\
  \ \"%\"\n    fan_entity:\n      name: Fan to control\n      description: Fan that\
  \ should be turned on/off\n      selector:\n        entity:\n          domain: fan\n\
  \ntrigger:\n  - platform: numeric_state\n    entity_id: !input humidity_sensor\n\
  \    above: !input humidity_level\n    id: turn_on\n  - platform: numeric_state\n\
  \    entity_id: !input humidity_sensor\n    below: !input humidity_level\n    id:\
  \ turn_off\n\ncondition: []   # No extra conditions – feel free to add your own\n\
  \naction:\n  - choose:\n      # Turn the fan **on** when humidity goes above the\
  \ threshold,\n      # but only if it is currently off.\n      - conditions:\n  \
  \        - condition: trigger\n            id: turn_on\n          - condition: state\n\
  \            entity_id: !input fan_entity\n            state: \"off\"\n        sequence:\n\
  \          - service: fan.turn_on\n            target:\n              entity_id:\
  \ !input fan_entity\n\n      # Turn the fan **off** when humidity drops below the\
  \ threshold,\n      # but only if it is currently on.\n      - conditions:\n   \
  \       - condition: trigger\n            id: turn_off\n          - condition: state\n\
  \            entity_id: !input fan_entity\n            state: \"on\"\n        sequence:\n\
  \          - service: fan.turn_off\n            target:\n              entity_id:\
  \ !input fan_entity\n    default: []\n```\n\n### How it works\n\n1. **Triggers**\
  \  \n   - The first trigger fires when the selected humidity sensor rises **above**\
  \ the chosen `humidity_level`.  \n   - The second trigger fires when the sensor\
  \ falls **below** that level.\n\n2. **Choose‑action block**  \n   - When the *above*\
  \ trigger fires, the automation checks that the fan is currently `off`. If so, it\
  \ calls `fan.turn_on`.  \n   - When the *below* trigger fires, it checks that the\
  \ fan is `on` before calling `fan.turn_off`.\n\n3. **No redundant commands** – because\
  \ each branch first confirms the fan’s current state, the automation never tries\
  \ to turn the fan on when it’s already on, nor off when it’s already off.\n\nYou\
  \ can add extra conditions (e.g., time of day, occupancy) under the `condition:`\
  \ section if you need more control. Save this YAML as a `.yaml` file in your `blueprints/automation`\
  \ directory (or use the UI’s *Blueprint* editor) and then create an automation from\
  \ it, selecting the appropriate humidity sensor, trigger level, and fan."
