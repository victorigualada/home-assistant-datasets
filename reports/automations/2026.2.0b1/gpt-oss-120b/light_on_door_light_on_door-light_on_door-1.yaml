task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here is a reusable Blueprint that you can add to **Configuration → Blueprints\
  \ → Import Blueprint** in Home Assistant.  \nIt turns one (or more) lights on when\
  \ a door (binary sensor) opens, turns them off when the door closes, and also turns\
  \ them off after a 2‑minute timeout if the door stays open.\n\n```yaml\n# blueprints/automation/light_on_door.yaml\n\
  blueprint:\n  name: Light on door\n  description: Turn on a light (or lights) when\
  \ a door opens, turn it off when the door closes or after a timeout.\n  domain:\
  \ automation\n  input:\n    door_sensor:\n      name: Door sensor\n      description:\
  \ Binary sensor that reports the door state\n      selector:\n        entity:\n\
  \          domain: binary_sensor\n    light_switch:\n      name: Light(s) to control\n\
  \      description: Light(s) that will be turned on/off\n      selector:\n     \
  \   target:\n          entity:\n            domain: light\n    timeout:\n      name:\
  \ Timeout (minutes)\n      description: How long to keep the light on after the\
  \ door opens (0 = no timeout)\n      default: 2\n      selector:\n        number:\n\
  \          min: 0\n          max: 60\n          unit_of_measurement: minutes\n\n\
  mode: restart\nmax_exceeded: silent\n\ntrigger:\n  - platform: state\n    entity_id:\
  \ !input door_sensor\n    from: \"off\"\n    to: \"on\"          # door opened\n\
  \naction:\n  # Turn on the light(s) immediately\n  - service: light.turn_on\n  \
  \  target: !input light_switch\n\n  # If a timeout is set (>0), wait that long then\
  \ turn lights off\n  - choose:\n      - conditions:\n          - condition: template\n\
  \            value_template: \"{{ (inputs.timeout | int) > 0 }}\"\n        sequence:\n\
  \          - delay: \"{{ (inputs.timeout | int) * 60 }}\"   # minutes → seconds\n\
  \          - service: light.turn_off\n            target: !input light_switch\n\n\
  \  # Also listen for the door closing – this will cancel the timeout because the\n\
  \  # automation mode is “restart” (the new run will turn the lights off immediately)\n\
  \  - wait_for_trigger:\n      - platform: state\n        entity_id: !input door_sensor\n\
  \        from: \"on\"\n        to: \"off\"\n    timeout: 0\n  - service: light.turn_off\n\
  \    target: !input light_switch\n```\n\n### How to use it\n1. Save the file as\
  \ `blueprints/automation/light_on_door.yaml` (or any name you like) in your Home Assistant\
  \ config folder.\n2. In the UI go to **Settings → Automations & Scenes → Blueprints**,\
  \ click **Import Blueprint**, and select the file.\n3. Create a new automation from\
  \ the imported blueprint and select:\n   * **Door sensor** – e.g. `binary_sensor.pantry_door`\n\
  \   * **Light(s) to control** – e.g. `light.pantry_light`\n   * **Timeout** – keep\
  \ the default **2** minutes or change as desired.\n\nThe automation will now turn\
  \ the selected light(s) on when the door opens, turn them off when the door closes,\
  \ and also ensure they turn off after the configured timeout if the door stays open."
